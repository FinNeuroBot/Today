<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a1a">
<title>Meals · London</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Design system copied from Today (index.html) so both pages match */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface-2: #242424; --surface-3: #2e2e2e;
    --border: rgba(255,255,255,0.08); --border-2: rgba(255,255,255,0.14);
    --text: #f5f5f0; --muted: #8a8a82; --dim: #5a5a55;
    --accent: #c9a961; --accent-2: #e8d4a0;
    --green: #7fa650; --amber: #d99850; --red: #c26a5a; --blue: #6f8fb0;
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html, body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 15px; line-height: 1.55; letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased; min-height: 100vh; overscroll-behavior-y: contain;
  }
  body { padding: 0 0 env(safe-area-inset-bottom); max-width: 520px; margin: 0 auto; }
  button, input { font-family: var(--sans); color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header + tabs (identical to Today) */
  /* Header pads itself below the phone's status bar, so content never shows through behind the clock */
  header { padding: calc(1.25rem + env(safe-area-inset-top)) 1.25rem 0.75rem; position: sticky; top: 0; background: var(--bg); z-index: 10; border-bottom: 1px solid var(--border); }
  .h-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.5rem; }
  .h-date { font-family: var(--serif); font-size: 1.7rem; font-style: italic; font-weight: 400; letter-spacing: -0.02em; line-height: 1; }
  .h-date em { color: var(--accent); }
  .h-right { display: flex; align-items: baseline; gap: 1rem; }
  .h-meta { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
  .h-nav-link { font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.06em; color: var(--muted); text-decoration: none; text-transform: uppercase; transition: color 0.15s; }
  .h-nav-link:hover { color: var(--accent); }
  .tabs { display: flex; margin: 0 -1.25rem -0.75rem; padding: 0 1.25rem; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 0.7rem 0; margin-right: 1.5rem; font-size: 0.78rem; font-weight: 500; color: var(--muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; letter-spacing: 0.02em; white-space: nowrap; transition: color 0.15s; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:last-child { margin-right: 0; }

  main { padding: 1rem 1.25rem 3rem; }
  .section { display: none; animation: fadeIn 0.2s; }
  .section.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .section { animation: none; } }

  /* Mode strip (rest / training) */
  .mode-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 1rem; }
  .mode-btn { padding: 0.55rem 0.4rem; background: transparent; border: none; border-radius: 7px; color: var(--muted); font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .mode-btn.active { background: var(--accent); color: #1a1a1a; }

  /* Hero */
  .hero { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.1rem 0.9rem; margin-bottom: 1rem; }
  .hero-row-1 { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.15rem; }
  .hero-day { font-family: var(--serif); font-size: 1.55rem; font-style: italic; line-height: 1; }
  .hero-kcal { font-family: var(--mono); font-size: 0.85rem; color: var(--accent-2); font-weight: 500; }
  .hero-type { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.75rem; }

  /* Section headers */
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 1.5rem 0 0.6rem; }
  .sec-h:first-child { margin-top: 0.25rem; }
  .sec-h h2 { font-family: var(--serif); font-size: 1.3rem; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
  .sec-h .sec-sub { font-family: var(--mono); font-size: 0.65rem; color: var(--dim); letter-spacing: 0.1em; text-transform: uppercase; text-align: right; }
  .intro { font-size: 0.82rem; color: var(--muted); line-height: 1.55; margin-bottom: 1rem; }

  /* Meal / recipe cards */
  .meal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  .meal-head { display: flex; align-items: center; gap: 10px; padding: 0.8rem 0.9rem; cursor: pointer; user-select: none; }
  .meal-info { flex: 1; min-width: 0; }
  .meal-time { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .meal-name { font-size: 0.95rem; font-weight: 500; margin-top: 1px; }
  .meal-macros { display: flex; gap: 10px; flex-shrink: 0; font-family: var(--mono); font-size: 0.68rem; color: var(--accent-2); }
  .meal-expand { color: var(--muted); font-size: 1.1rem; transition: transform 0.2s; flex-shrink: 0; width: 12px; }
  .meal.open .meal-expand { transform: rotate(180deg); }
  .meal-body { display: none; padding: 0.8rem 0.9rem 0.9rem; border-top: 1px solid var(--border); }
  .meal.open .meal-body { display: block; }
  .meal-desc { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.75rem; line-height: 1.55; }
  .meal-desc strong { color: var(--accent-2); font-weight: 500; font-family: var(--mono); font-size: 0.75rem; }
  .ing-list { list-style: none; font-size: 0.83rem; margin-bottom: 0.8rem; }
  .ing-list li { display: flex; justify-content: space-between; gap: 10px; padding: 0.25rem 0; border-bottom: 1px dashed var(--border); }
  .ing-list li:last-child { border: none; }
  .ing-list li span:first-child::before { content: "—"; color: var(--dim); margin-right: 8px; }
  .ing-list .q { font-family: var(--mono); font-size: 0.75rem; color: var(--accent-2); white-space: nowrap; }
  .steps { padding-left: 1.1rem; font-size: 0.83rem; margin-bottom: 0.8rem; }
  .steps li { margin-bottom: 0.3rem; }
  .macro-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--surface-2); padding: 0.55rem; border-radius: 8px; margin-top: 0.5rem; }
  .mb-cell { text-align: center; }
  .mb-v { font-family: var(--mono); font-size: 0.9rem; font-weight: 500; color: var(--accent-2); }
  .mb-l { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }
  .prep-note { background: rgba(201,169,97,0.08); border: 1px solid rgba(201,169,97,0.2); border-radius: 8px; padding: 0.6rem 0.75rem; font-size: 0.78rem; color: var(--accent-2); margin-bottom: 0.75rem; }
  .prep-note strong { color: var(--accent); font-weight: 500; }

  /* Task list */
  .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.35rem 0.9rem; }
  .task { display: flex; gap: 10px; padding: 0.55rem 0; font-size: 0.85rem; border-bottom: 1px dashed var(--border); }
  .task:last-child { border: none; }
  .task::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 0.5rem; flex-shrink: 0; }

  /* Cook session */
  .cook-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; }
  .cook-when { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.6rem; }
  .tl { display: grid; grid-template-columns: 3.4rem 1fr; gap: 0.6rem; padding: 0.6rem 0; border-top: 1px dashed var(--border); font-size: 0.85rem; }
  .tl-t { font-family: var(--mono); font-size: 0.75rem; color: var(--accent-2); padding-top: 0.1rem; }

  /* Week cards */
  .w-day-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 0.9rem; margin-bottom: 6px; display: flex; gap: 12px; }
  .w-day-card.is-today { border-color: var(--accent); background: rgba(201,169,97,0.04); }
  .wd-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--surface-3); flex-shrink: 0; margin-top: 0.35rem; }
  .wd-dot.today { background: var(--accent); box-shadow: 0 0 0 3px rgba(201,169,97,0.2); }
  .wd-info { flex: 1; min-width: 0; }
  .wd-dow { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .wd-meals { font-size: 0.85rem; margin-top: 3px; line-height: 1.5; }
  .wd-meals span { color: var(--dim); font-family: var(--mono); font-size: 0.65rem; margin-right: 6px; }
  .wd-kcal { font-family: var(--mono); font-size: 0.72rem; color: var(--accent-2); text-align: right; flex-shrink: 0; }
  .wd-kcal small { display: block; color: var(--green); }

  /* Settings rows */
  .settings-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.85rem 0; border-bottom: 1px solid var(--border); }
  .settings-row:last-child { border: none; }
  .sr-label { font-size: 0.88rem; }
  .sr-sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .sr-action { font-family: var(--mono); font-size: 0.7rem; color: var(--accent); background: none; border: none; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  .sr-action.danger { color: var(--red); }
  .link { background: none; border: none; color: var(--accent); text-decoration: underline; font-size: 0.72rem; cursor: pointer; padding: 0; }

  /* Pills */
  .pill { display: inline-block; padding: 1px 7px; border-radius: 4px; font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; background: var(--surface-2); color: var(--muted); vertical-align: 1px; }
  .pill.green { background: rgba(127,166,80,0.15); color: var(--green); }
  .pill.gold { background: rgba(201,169,97,0.15); color: var(--accent); }
  .pill.amber { background: rgba(217,152,80,0.15); color: var(--amber); }

  /* Grocery (identical pattern to Today) */
  .groc-toggle { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 1rem; }
  .groc-toggle button { flex: 1; padding: 0.5rem; background: transparent; border: none; border-radius: 7px; color: var(--muted); font-size: 0.8rem; font-weight: 500; cursor: pointer; }
  .groc-toggle button.active { background: var(--accent); color: #1a1a1a; }
  .store { margin-bottom: 1.25rem; }
  .store-h { font-family: var(--serif); font-size: 1.15rem; font-style: italic; margin-bottom: 0.5rem; color: var(--accent-2); }
  .store-sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.6rem; margin-top: -0.3rem; }
  .groc-item { display: flex; align-items: flex-start; gap: 10px; padding: 0.7rem 0.85rem; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; margin-bottom: 5px; cursor: pointer; user-select: none; }
  .groc-item.checked { opacity: 0.45; background: var(--surface-2); }
  .groc-item.checked .g-name { text-decoration: line-through; color: var(--muted); }
  .g-check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .groc-item.checked .g-check { background: var(--accent); border-color: var(--accent); }
  .g-check::after { content: ""; width: 7px; height: 4px; border-left: 2px solid #1a1a1a; border-bottom: 2px solid #1a1a1a; transform: rotate(-45deg) translate(1px, -1px); opacity: 0; }
  .groc-item.checked .g-check::after { opacity: 1; }
  .g-body { flex: 1; min-width: 0; }
  .g-name { font-size: 0.9rem; font-weight: 500; }
  .g-meta { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
  .g-note { font-size: 0.74rem; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .g-price { font-family: var(--mono); font-size: 0.72rem; color: var(--green); flex-shrink: 0; }
  .total { text-align: center; font-family: var(--mono); font-size: 0.85rem; color: var(--accent); margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .total small { display: block; font-family: var(--sans); font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem; }

  /* Price inputs */
  .price-in { width: 5.2rem; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 7px; padding: 0.4rem 0.5rem; font-family: var(--mono); font-size: 0.8rem; color: var(--text); text-align: right; }
  .price-r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }

  .cb-active { background: rgba(201,169,97,0.08); border: 1px solid rgba(201,169,97,0.3); border-radius: 10px; padding: 0.9rem; margin-bottom: 1rem; font-size: 0.85rem; }
  .foot { font-size: 0.75rem; color: var(--dim); margin-top: 2rem; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <div class="h-top">
    <div class="h-date">Meals<em>.</em></div>
    <div class="h-right">
      <div class="h-meta">London</div>
      <a href="index.html" class="h-nav-link">← Today</a>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="week">Week</button>
    <button class="tab" data-tab="recipes">Recipes</button>
    <button class="tab" data-tab="shop">Shop</button>
    <button class="tab" data-tab="prices">Prices</button>
  </div>
</header>

<main>
  <div class="section active" id="tab-today"></div>
  <div class="section" id="tab-week"></div>
  <div class="section" id="tab-recipes"></div>
  <div class="section" id="tab-shop"></div>
  <div class="section" id="tab-prices"></div>
</main>

<script>
/* ============================================================

/* ============================================================
   CALCULATIONS
   ============================================================ */
function grams(k,q){return ING[k].unit==='each'?q*ING[k].g:q}
function macros(ing){
  const t=[0,0,0,0];
  for(const k in ing){const g=grams(k,ing[k]);for(let i=0;i<4;i++)t[i]+=ING[k].m[i]*g/100}
  return t;
}
const rmac = k => macros(R[k].ing);
function dayRecipes(i,training){
  const w=WEEK[i]; const list=[w.B,w.L,w.D,'eveshake'];
  if(training) list.push(i%2?'banpb':'bandates');
  return list;
}
function dayTotals(i,training){
  const t=[0,0,0,0];
  dayRecipes(i,training).forEach(r=>rmac(r).forEach((v,j)=>t[j]+=v));
  return t;
}
function addTo(map,k,q){map[k]=(map[k]||0)+q}
function shopNeeds(cover,chiliMode){
  const m={};
  cover.forEach(([d,slots])=>slots.forEach(s=>{
    const r = s==='E'?'eveshake':WEEK[d][s];
    for(const k in R[r].ing){
      if(r==='chili' && CHILI_BASE.includes(k)) continue;
      addTo(m,k,R[r].ing[k]);
    }
  }));
  return m;
}
function shoppingLists(){
  const chiliMode = store.get('chili','cook');
  const a=shopNeeds(SHOP_A), b=shopNeeds(SHOP_B);
  if(chiliMode==='cook') CHILI_BASE.forEach(k=>addTo(a,k,R.chili.ing[k]*4));
  const lists={A:{},B:{},P:{}};
  const all=new Set([...Object.keys(a),...Object.keys(b)]);
  all.forEach(k=>{
    const key = ING[k].asEgg?'egg':k;
    const qa=a[k]||0, qb=b[k]||0;
    if(ING[k].buy==='pantry'){addTo(lists.P,key,qa+qb)}
    else if(ING[k].buy==='A'){addTo(lists.A,key,qa+qb)}
    else {if(qa)addTo(lists.A,key,qa); if(qb)addTo(lists.B,key,qb)}
  });
  return lists;
}
function cost(k,q){return ING[k].unit==='each'?q*price(k):q/1000*price(k)}

function todayIndex(){ const d=new Date().getDay(); return store.get('late',false) ? (d+6)%7 : d; }

function macroBar(t){

    <div class="mb-cell"><div class="mb-v">${f0(t[1])}g</div><div class="mb-l">Protein</div></div>
    <div class="mb-cell"><div class="mb-v">${f0(t[2])}g</div><div class="mb-l">Carbs</div></div>

    <div class="mb-cell"><div class="mb-v">${f0(t[0])}</div><div class="mb-l">kcal</div></div></div>`;
}
function recipeCard(r, id, label){
  const rc=R[r], t=rmac(r), m=META[r]||{};
  return `<div class="meal ${open.has(id)?'open':''}" data-card="${id}">
    <div class="meal-head">

      <div class="meal-expand">▾</div>

      <div class="prep-note">${rc.keep}</div>
      ${macroBar(t)}

}
function bindCards(root){

function chiliThaw(i){
  if(store.get('chili','cook')!=='freezer') return [];
  if(i===6) return ['Chili is from the freezer this week: move one portion to the fridge tonight for Sunday.'];
  if(i===0) return ['Tonight: move the second frozen chili portion to the fridge for Monday.'];
  return [];
}
function cookHTML(i){
  const c=COOK[i]; if(!c) return '';

    groups.map(g=>{
      const list=Object.keys(R).filter(k=>R[k].slot===g);
      return `<div class="sec-h"><h2>${g}</h2><div class="sec-sub">${list.length} recipe${list.length>1?'s':''}</div></div>` +
        list.map(k=>recipeCard(k,'r'+k,(META[k]||{}).t||g)).join('');
    }).join('');
  bindCards(el);
}

/* ---------- Shop ---------- */
function renderShop(){
  const L=shoppingLists(), which=store.get('shopTab','A'), map=L[which];
  const ticks=store.get('ticks:'+which,{}), alt=store.get('storeAlt',{});
  const intro={
    A:'Sunday. Covers Sunday lunch to Wednesday dinner, plus things bought once a week (salmon, eggs, potatoes, frozen berries).',
    B:'Wednesday. Covers Thursday to Saturday, plus next Sunday\u2019s breakfast.',
    P:'Long-life staples. Amounts are this week\u2019s use, so restock when low. First trip only: cumin, chili powder, smoked paprika, garlic powder, dried dill.'}[which];
  const byStore={}; let total=0;
  Object.keys(map).forEach(k=>{(byStore[effStore(k)]=byStore[effStore(k)]||[]).push(k)});
  const order=['aldi','sc','local','ice','web'];
  const blocks=order.filter(s=>byStore[s]).map(s=>{
    const items=byStore[s].sort((a,b)=>ING[a].n.localeCompare(ING[b].n)).map(k=>{
      const q=map[k], i=ING[k], w=WHERE[k]||{}, c=cost(k,q); total+=c;
      const packs=i.pack?` \u00b7 ${Math.ceil(q/i.pack[0]-0.05)} \u00d7 ${i.pack[1]}`:'';
      const flag=w.st==='check'&&!alt[k]?' <span class="pill amber">Confirm</span>':'';
      return `<div class="groc-item ${ticks[k]?'checked':''}" data-k="${k}">
        <div class="g-check"></div>
        <div class="g-body"><div class="g-name">${i.n}${flag}</div>
          <div class="g-meta">${qtyText(k,q)}${k==='egg'?' eggs':''}${packs}</div>
          ${w.note?`<div class="g-note">${w.note}</div>`:''}</div>
        <div class="g-price">${money(c)}</div></div>`;
    }).join('');
    return `<div class="store"><div class="store-h">${STORES[s].short}</div><div class="store-sub">${STORES[s].n}</div>${items}</div>`;
  }).join('');
  const supps = which==='P' ? `<div class="store"><div class="store-h">Supplements</div><div class="store-sub">Monthly, not in the food cost</div>
    ${SUPPS.map(x=>`<div class="groc-item" style="cursor:default"><div class="g-body"><div class="g-name">${x.n}</div><div class="g-meta">${x.d}</div><div class="g-note">${x.where}</div></div></div>`).join('')}</div>` : '';
  const el=$('#tab-shop');
  el.innerHTML = `
    <div class="groc-toggle">${['A','B','P'].map(x=>`<button class="${x===which?'active':''}" data-shop="${x}">${{A:'Shop A',B:'Shop B',P:'Pantry'}[x]}</button>`).join('')}</div>
    <p class="intro">${intro}</p>
    ${blocks}${supps}
    <div class="total">Food used from this list: ${money(total)}<small>Receipts run higher, since you buy whole packs. Training-day snacks add a banana and some dates or peanut butter per session.</small></div>
    <div style="text-align:center;margin-top:1rem"><button class="sr-action" id="clearTicks">Clear ticks</button></div>`;
  el.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{store.set('shopTab',b.dataset.shop);renderShop()});
  el.querySelectorAll('.groc-item[data-k]').forEach(g=>g.onclick=()=>{const t=store.get('ticks:'+which,{});t[g.dataset.k]=!t[g.dataset.k];store.set('ticks:'+which,t);renderShop()});
  $('#clearTicks').onclick=()=>{store.set('ticks:'+which,{});renderShop()};
}

/* ---------- Prices ---------- */
function renderPrices(){
  const L=shoppingLists();
  const weekly=['A','B','P'].reduce((s,x)=>s+Object.entries(L[x]).reduce((a,[k,q])=>a+cost(k,q),0),0);
  const alt=store.get('storeAlt',{});
  const pillFor={checked:'green',online:'gold',guess:'amber'};
  const rows=Object.keys(ING).filter(k=>!ING[k].asEgg).map(k=>{
    const w=WHERE[k], s=src(k);
    const sw = w && w.s[0]!==w.s[1] ? ` \u00b7 <button class="link" data-alt="${k}">${alt[k]?'back to '+STORES[w.s[0]].short:STORES[w.s[0]].short+' doesn\u2019t have it'}</button>` : '';
    return `<div class="settings-row"><div><div class="sr-label">${ING[k].n}</div><div class="sr-sub">${STORES[effStore(k)].short}${sw}</div></div>
      <div class="price-r"><input class="price-in" inputmode="decimal" data-price="${k}" value="${price(k).toFixed(2)}" aria-label="${ING[k].n} price"><span class="pill ${pillFor[s]}">${s}</span></div></div>`;
  }).join('');
  $('#tab-prices').innerHTML = `
    <div class="sec-h"><h2>Prices</h2><div class="sec-sub">\u00a3 per kg \u00b7 per item for eggs, bananas</div></div>
    <p class="intro">Type in the shelf price and the item is marked <span class="pill green">checked</span>. Every cost updates. If a store doesn\u2019t stock something, tap the link under it and it moves to its fallback store. The four that matter most: skyr, chicken, turkey mince, salmon.</p>
    <div class="hero"><div class="hero-row-1"><div class="hero-day">Weekly food</div><div class="hero-kcal">${money(weekly)}</div></div></div>
    ${rows}
    <div style="margin-top:1.25rem"><button class="sr-action danger" id="resetPrices">Reset prices and stores</button></div>`;
  document.querySelectorAll('[data-price]').forEach(inp=>inp.onchange=()=>{
    const v=parseFloat(inp.value); if(isNaN(v)||v<0){inp.value=price(inp.dataset.price).toFixed(2);return}
    const p=store.get('prices',{}); p[inp.dataset.price]={p:v,date:dateKey()}; store.set('prices',p); renderAll();
  });
  document.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>{const o=store.get('storeAlt',{});o[b.dataset.alt]=!o[b.dataset.alt];store.set('storeAlt',o);renderAll()});
  $('#resetPrices').onclick=()=>{ if(confirm('Reset all prices and store choices to the defaults?')){store.set('prices',{});store.set('storeAlt',{});renderAll()} };
}

function renderAll(){renderToday();renderWeek();renderRecipes();renderShop();renderPrices()}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id==='tab-'+t.dataset.tab));
  window.scrollTo(0,0);
}));
renderAll();
</script>
</body>
</html>
